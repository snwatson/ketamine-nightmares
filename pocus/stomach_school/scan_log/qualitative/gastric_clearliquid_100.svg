<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 300 300">
  <defs>
    <!-- Outer wall gradient - echogenic -->
    <radialGradient id="outerWall" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </radialGradient>
    <!-- Muscularis layer -->
    <radialGradient id="muscularis" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#4a4a5a"/>
      <stop offset="100%" stop-color="#2a2a3a"/>
    </radialGradient>
    <!-- Lumen - purely anechoic (deep black) = clear fluid -->
    <radialGradient id="lumen" cx="45%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#0a0a18"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000040"/>
    </filter>
    <!-- Specular highlight on fluid -->
    <radialGradient id="highlight" cx="38%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#4466ff25"/>
      <stop offset="100%" stop-color="#ffffff00"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="#f5f5f0" stroke="#ddd" stroke-width="1"/>

  <!-- === GASTRIC ANTRUM - CLEAR LIQUID (BLACK CIRCLE) === -->
  <!-- Antrum is more rounded/distended compared to empty -->

  <!-- Layer 1: Echogenic outer wall -->
  <ellipse cx="150" cy="148" rx="108" ry="90" fill="url(#outerWall)" filter="url(#shadow)"/>

  <!-- Layer 2: Muscularis propria (dark hypoechoic ring) -->
  <ellipse cx="150" cy="148" rx="95" ry="78" fill="url(#muscularis)"/>

  <!-- Layer 3: Submucosa (bright echogenic ring) -->
  <ellipse cx="150" cy="148" rx="82" ry="66" fill="#c8c8c0"/>

  <!-- Layer 4: Mucosa -->
  <ellipse cx="150" cy="148" rx="70" ry="55" fill="#5a5a68"/>

  <!-- Layer 5: Lumen - uniformly anechoic / pure black = clear fluid -->
  <ellipse cx="150" cy="147" rx="57" ry="43" fill="url(#lumen)"/>

  <!-- Subtle blue-tinted specular highlight (fluid reflection) -->
  <ellipse cx="138" cy="135" rx="22" ry="14" fill="url(#highlight)"/>

  <!-- Label -->
</svg>
