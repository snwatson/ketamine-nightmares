<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#b0b0ac"/>
      <stop offset="25%"  stop-color="#505050"/>
      <stop offset="55%"  stop-color="#222222"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="leftFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#00000070"/>
      <stop offset="100%" stop-color="#00000000"/>
    </linearGradient>
    <linearGradient id="rightFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#00000000"/>
      <stop offset="100%" stop-color="#00000070"/>
    </linearGradient>
    <linearGradient id="anteriorWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="40%"  stop-color="#f0f0ee"/>
      <stop offset="100%" stop-color="#b0b0ac"/>
    </linearGradient>
    <filter id="wallGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="bgClip">
      <circle cx="150" cy="150" r="138"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="#f5f5f0" stroke="#ddd" stroke-width="1"/>

  <!-- Posterior acoustic shadowing -->
  <g clip-path="url(#bgClip)">
    <rect x="12" y="115" width="276" height="180" fill="url(#shadowGrad)"/>
    <rect x="12" y="115" width="110" height="180" fill="url(#leftFade)"/>
    <rect x="178" y="115" width="110" height="180" fill="url(#rightFade)"/>
    <!-- Vertical shadow banding -->
    <rect x="75"  y="165" width="16" height="120" fill="#0a0a0a" opacity="0.3" filter="url(#softBlur)"/>
    <rect x="145" y="170" width="12" height="115" fill="#080808" opacity="0.25" filter="url(#softBlur)"/>
    <rect x="212" y="167" width="15" height="118" fill="#0a0a0a" opacity="0.28" filter="url(#softBlur)"/>
  </g>

  <!-- Anterior wall fill - flatter arc with irregular bumpy top edge -->
  <!-- The filled body of the wall -->
  <path d="M 42,158
             C 55,130 90,108 150,106
             C 210,108 245,130 258,158
             C 245,148 210,132 150,130
             C 90,132 55,148 42,158 Z"
        fill="url(#anteriorWall)" filter="url(#wallGlow)"/>

  <!-- Irregular bright surface - flatter with jagged bumps -->
  <path d="M 44,153
             C 52,138 62,125 74,118
             C 80,115 85,119 90,116
             C 95,113 97,108 103,106
             C 108,104 111,109 116,107
             C 121,105 123,101 129,100
             C 134,99  137,103 142,101
             C 146,100 148,97  152,97
             C 156,97  158,101 163,100
             C 168,99  170,95  175,96
             C 180,97  182,102 187,101
             C 192,100 195,96  200,97
             C 206,98  209,104 214,106
             C 220,108 224,104 229,107
             C 236,111 242,120 250,133
             C 254,140 256,148 257,154"
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"
        stroke-linejoin="round" opacity="0.97"/>

  <!-- Reverberation line 1 -->
  <path d="M 62,168
             C 74,150 100,136 128,131
             C 138,129 144,133 152,132
             C 162,130 180,134 200,144
             C 216,152 230,163 238,172"
        fill="none" stroke="#d8d8d4" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>

  <!-- Reverberation line 2 -->
  <path d="M 84,182
             C 96,168 116,158 140,154
             C 150,152 162,155 176,161
             C 192,168 206,180 214,190"
        fill="none" stroke="#a0a09c" stroke-width="1.6" stroke-linecap="round" opacity="0.38"/>

  <!-- Label -->
</svg>
