<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="outerWall" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </radialGradient>
    <radialGradient id="lumen" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="muscularis" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#4a4a5a"/>
      <stop offset="100%" stop-color="#2a2a3a"/>
    </radialGradient>
    <radialGradient id="highlight" cx="40%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ffffff60"/>
      <stop offset="100%" stop-color="#ffffff00"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="150" cy="150" r="140" fill="#f5f5f0" stroke="#ddd" stroke-width="1"/>

  <!-- === GASTRIC ANTRUM - EMPTY (BULLSEYE) - flat/collapsed === -->

  <!-- Layer 1: Outermost serosa/echogenic outer wall - very flat -->
  <ellipse cx="150" cy="150" rx="112" ry="42" fill="url(#outerWall)" filter="url(#shadow)"/>

  <!-- Layer 2: Muscularis propria (dark hypoechoic ring) -->
  <ellipse cx="150" cy="150" rx="98" ry="32" fill="url(#muscularis)"/>

  <!-- Layer 3: Submucosa (bright echogenic ring) -->
  <ellipse cx="150" cy="150" rx="84" ry="22" fill="#c8c8c0"/>

  <!-- Layer 4: Mucosa (slightly darker) -->
  <ellipse cx="150" cy="150" rx="70" ry="14" fill="#5a5a68"/>

  <!-- Layer 5: Lumen - very flat slit-like anechoic centre -->
  <ellipse cx="150" cy="150" rx="54" ry="7" fill="url(#lumen)"/>

  <!-- Specular highlight -->
  <ellipse cx="138" cy="148" rx="14" ry="4" fill="url(#highlight)"/>
</svg>
